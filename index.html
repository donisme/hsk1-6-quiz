<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luyện từ vựng HSK 1-6</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f4f0;color:#1a1a1a;min-height:100vh}
.app{max-width:700px;margin:0 auto;padding:1.5rem 1rem}
h1{font-size:20px;font-weight:600;margin-bottom:1.25rem}
.level-tabs{display:flex;gap:.4rem;margin-bottom:1rem;flex-wrap:wrap}
.tab{padding:.3rem .75rem;border:1px solid #ddd;border-radius:8px;font-size:13px;cursor:pointer;background:#fff;color:#555;transition:all .15s;white-space:nowrap}
.tab.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.stats{display:flex;gap:.5rem;margin-bottom:1rem}
.stat{background:#fff;border-radius:8px;padding:.5rem .75rem;flex:1;text-align:center;border:1px solid #e8e8e8}
.stat-num{font-size:20px;font-weight:600}
.stat-lbl{font-size:11px;color:#888;margin-top:1px}
.mode-select{display:flex;gap:.4rem;margin-bottom:1rem;flex-wrap:wrap}
.mode-btn{padding:.3rem .6rem;border:1px solid #ddd;border-radius:8px;font-size:12px;cursor:pointer;background:#fff;color:#555;flex:1;text-align:center}
.mode-btn.active{border-color:#1a1a1a;color:#1a1a1a;font-weight:600}
.prog-bar{height:4px;background:#e8e8e8;border-radius:2px;margin-bottom:1rem;overflow:hidden}
.prog-fill{height:100%;background:#22c55e;border-radius:2px;transition:width .3s}
.card{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:1.5rem;margin-bottom:1rem;text-align:center;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem}
.hanzi{font-size:52px;line-height:1.1;cursor:pointer;color:#1a1a1a;user-select:none}
.pinyin{font-size:15px;color:#888;min-height:22px}
.meaning{font-size:17px;font-weight:500;min-height:26px}
.hint{font-size:12px;color:#bbb;margin-top:.25rem}
.example-box{background:#f8f8f6;border-radius:8px;padding:.75rem;margin-top:.5rem;width:100%;text-align:left}
.ex-zh{font-size:14px;margin-bottom:.2rem}
.ex-vn{font-size:13px;color:#666}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:1rem}
.choice{padding:.65rem .75rem;border:1px solid #e8e8e8;border-radius:8px;font-size:13px;cursor:pointer;background:#fff;text-align:left;transition:all .12s;line-height:1.3}
.choice:hover:not(:disabled){background:#f5f5f5}
.choice.correct{background:#dcfce7;border-color:#86efac;color:#15803d}
.choice.wrong{background:#fee2e2;border-color:#fca5a5;color:#dc2626}
.input-row{display:flex;gap:.5rem;margin-bottom:.75rem}
.ans-input{flex:1;padding:.55rem .8rem;border:1px solid #ddd;border-radius:8px;font-size:15px}
.ans-input:focus{outline:none;border-color:#1a1a1a}
.btn{padding:.55rem 1.1rem;border:1px solid #ddd;border-radius:8px;font-size:14px;cursor:pointer;background:#fff;transition:all .12s}
.btn:hover{background:#f5f5f5}
.btn.primary{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.btn.primary:hover{background:#333}
.btn.ok{background:#dcfce7;border-color:#86efac;color:#15803d}
.btn.bad{background:#fee2e2;border-color:#fca5a5;color:#dc2626}
.feedback{padding:.5rem .9rem;border-radius:8px;font-size:14px;margin-bottom:.75rem;text-align:center}
.feedback.ok{background:#dcfce7;color:#15803d}
.feedback.bad{background:#fee2e2;color:#dc2626}
.nav{display:flex;gap:.5rem;justify-content:center;align-items:center;padding-bottom:2rem}
.badge{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600;display:inline-block;margin-bottom:.25rem}
.badge-hsk1{background:#eef2ff;color:#3730a3}
.badge-hsk2{background:#e0fdf4;color:#065f46}
.badge-hsk3{background:#fff7ed;color:#92400e}
.badge-hsk4{background:#ede9fe;color:#5b21b6}
.badge-hsk5{background:#fef3c7;color:#92400e}
.badge-hsk6{background:#fce7f3;color:#9d174d}
@media(max-width:480px){
  .hanzi{font-size:44px}
  .choices{grid-template-columns:1fr}
  .mode-btn{font-size:11px;padding:.3rem .4rem}
}
</style>
</head>
<body>
<div class="app">
  <h1>🀄 Luyện từ vựng HSK 1-6</h1>
  <div class="level-tabs">

    <button class="tab" onclick="setLevel('HSK5')">HSK 5 <small style="opacity:.6">(1295)</small></button>
    <button class="tab" onclick="setLevel('HSK6')">HSK 6 <small style="opacity:.6">(2513)</small></button>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-num" id="s-total">0</div><div class="stat-lbl">Tổng</div></div>

    <div class="stat"><div class="stat-num" id="s-pct">—</div><div class="stat-lbl">Tỉ lệ</div></div>
  </div>
  <div class="mode-select">
    <button class="mode-btn active" onclick="setMode('flashcard')">📖 Flashcard</button>
    <button class="mode-btn" onclick="setMode('mc')">🔢 Trắc nghiệm</button>
    <button class="mode-btn" onclick="setMode('type')">⌨️ Gõ nghĩa</button>
    <button class="mode-btn" onclick="setMode('listen')">👂 Đọc→Nghĩa</button>
  </div>
  <div class="prog-bar"><div class="prog-fill" id="prog" style="width:0%"></div></div>
  <div id="quiz-area"></div>
  <div class="nav" id="nav-area"></div>
</div>

  HSK4:[{"hanzi":"爱情","pinyin":"ài qíng [ái tình]","meaning":"tình yêu","example_hanzi":"他们的爱情很美好。","example_viet":"Tình yêu của họ rất đẹp."},{"hanzi":"安排","pinyin":"ān pái [an bài]","meaning":"sắp xếp","example_hanzi":"我已经安排好了行程。","example_viet":"Tôi đã sắp xếp xong hành trình."},{"hanzi":"安全","pinyin":"ān quán [an toàn]","meaning":"an toàn","example_hanzi":"这个地方很安全。","example_viet":"Nơi này rất an toàn."},{"hanzi":"按时","pinyin":"àn shí","meaning":"đúng hạn","example_hanzi":"我们必须按时完成任务。","example_viet":"Chúng ta phải hoàn thành nhiệm vụ đúng giờ."},{"hanzi":"按照","pinyin":"àn zhào","meaning":"dựa vào, theo","example_hanzi":"请按照说明操作。","example_viet":"Vui lòng làm theo hướng dẫn."},{"hanzi":"百分之","pinyin":"bǎi fēn zhī","meaning":"%","example_hanzi":"他的考试成绩是百分之九十。","example_viet":"Điểm thi của anh ấy là 90%."},{"hanzi":"棒","pinyin":"bàng","meaning":"cây gậy/ giỏi, tốt","example_hanzi":"你真棒！","example_viet":"Bạn thật tuyệt!"},{"hanzi":"包子","pinyin":"bāo zi","meaning":"bánh bao","example_hanzi":"我喜欢吃包子。","example_viet":"Tôi thích ăn bánh bao."},{"hanzi":"保护","pinyin":"bǎo hù","meaning":"che chở, bảo vệ","example_hanzi":"我们要保护环境。","example_viet":"Chúng ta cần bảo vệ môi trường."},{"hanzi":"保证","pinyin":"bǎo zhèng","meaning":"đảm bảo, cam đoan","example_hanzi":"我保证完成任务。","example_viet":"Tôi cam đoan hoàn thành nhiệm vụ."},{"hanzi":"报名","pinyin":"bào míng","meaning":"đăng kí","example_hanzi":"我报名参加了比赛。","example_viet":"Tôi đã đăng ký tham gia cuộc thi."},{"hanzi":"抱","pinyin":"bào","meaning":"ôm","example_hanzi":"他抱了我。","example_viet":"Anh ấy đã ôm tôi."},{"hanzi":"抱歉","pinyin":"bào qiàn","meaning":"xin lỗi","example_hanzi":"很抱歉，我来晚了。","example_viet":"Xin lỗi, tôi đến muộn."},{"hanzi":"倍","pinyin":"bèi","meaning":"lần","example_hanzi":"价格翻了两倍。","example_viet":"Giá cả tăng gấp đôi."},{"hanzi":"本来","pinyin":"běn lái","meaning":"vốn có","example_hanzi":"本来我不想去的。","example_viet":"Ban đầu tôi không muốn đi."},{"hanzi":"笨","pinyin":"bèn","meaning":"ngốc nghếch","example_hanzi":"他有点笨，但很努力。","example_viet":"Anh ấy hơi ngốc, nhưng rất nỗ lực."},{"hanzi":"比如","pinyin":"bǐ rú","meaning":"ví dụ như","example_hanzi":"比如说，苹果和香蕉。","example_viet":"Ví dụ như, táo và chuối."},{"hanzi":"毕业","pinyin":"bì yè","meaning":"tốt nghiệp","example_hanzi":"他今年大学毕业了。","example_viet":"Năm nay anh ấy tốt nghiệp đại học."},{"hanzi":"遍","pinyin":"biàn","meaning":"lần, lượt","example_hanzi":"这本书我看三遍了。","example_viet":"Tôi đã đọc cuốn sách này ba lần."},{"hanzi":"标准","pinyin":"biāo zhǔn","meaning":"tiêu chuẩn","example_hanzi":"他的中文发音很标准。","example_viet":"Phát âm tiếng Trung của anh ấy rất chuẩn."},{"hanzi":"表格","pinyin":"biǎo gé","meaning":"bảng biểu","example_hanzi":"请填写这张表格。","example_viet":"Vui lòng điền vào mẫu đơn này."},{"hanzi":"表示","pinyin":"biǎo shì","meaning":"biểu thị, cho thấy","example_hanzi":"他表示同意。","example_viet":"Anh ấy biểu thị đồng ý."},{"hanzi":"表演","pinyin":"biǎo yǎn","meaning":"biểu diễn","example_hanzi":"她的表演很精彩。","example_viet":"Màn biểu diễn của cô ấy rất xuất sắc."},{"hanzi":"表扬","pinyin":"biǎo yáng","meaning":"tuyên dương","example_hanzi":"老师表扬了他。","example_viet":"Thầy giáo khen ngợi anh ấy."},{"hanzi":"饼干","pinyin":"bǐng gān","meaning":"bánh","example_hanzi":"我喜欢吃饼干。","example_viet":"Tôi thích ăn bánh quy."},{"hanzi":"并且","pinyin":"bìng qiě","meaning":"đồng thời","example_hanzi":"她聪明并且努力。","example_viet":"Cô ấy thông minh và chăm chỉ."},{"hanzi":"博士","pinyin":"bó shì","meaning":"tiến sĩ","example_hanzi":"他是一个博士。","example_viet":"Anh ấy là một tiến sĩ."},{"hanzi":"不得不","pinyin":"bù dé bù","meaning":"đành","example_hanzi":"我不得不去工作。","example_viet":"Tôi không thể không đi làm."},{"hanzi":"不管","pinyin":"bù guǎn","meaning":"bất kể","example_hanzi":"不管天气如何，我都会去。","example_viet":"Bất kể thời tiết thế nào, tôi cũng sẽ đi."},{"hanzi":"不过","pinyin":"bù guò","meaning":"nhưng, có điều","example_hanzi":"不过，这样更好。","example_viet":"có điều, như vậy tốt hơn."},{"hanzi":"不仅","pinyin":"bù jǐn","meaning":"không những","example_hanzi":"他不仅聪明，而且很努力。","example_vie eaning":"hái","example_hanzi":"我们要摘一些水果。","example_viet":"Chúng ta cần hái một số trái cây."},{"hanzi":"窄","pinyin":"zhǎi","meaning":"hẹp","example_hanzi":"这条路很窄，车子不能通过。","example_viet":"Con đường này rất hẹp, xe không thể đi qua được."},{"hanzi":"粘贴","pinyin":"zhān tiē","meaning":"dính, dán","example_hanzi":"请将这张纸粘贴在墙上。","example_viet":"Xin hãy dán tờ giấy này lên tường."},{"hanzi":"展开","pinyin":"zhǎn kāi","meaning":"xòe ra, triển khai","example_hanzi":"我们需要展开新的计划。","example_viet":"Chúng ta cần triển khai kế hoạch mới."},{"hanzi":"展览","pinyin":"zhǎn lǎn","meaning":"triển lãm","example_hanzi":"这个展览吸引了很多游客。","example_viet":"Triển lãm này thu hút nhiều du khách."},{"hanzi":"占","pinyin":"zhàn","meaning":"chiếm","example_hanzi":"这个地区占据了很大的面积。","example_viet":"Khu vực này chiếm một diện tích rất lớn."},{"hanzi":"战争","pinyin":"zhàn zhēng","meaning":"chiến tranh","example_hanzi":"战争给人民带来了巨大的痛苦。","example_viet":"Chiến tranh đã mang lại nỗi đau lớn cho nhân dân."},{"hanzi":"长辈","pinyin":"zhǎng bèi","meaning":"tiền bối","example_hanzi":"我们应该尊敬长辈。","example_viet":"Chúng ta nên kính trọng người lớn tuổi."},{"hanzi":"涨","pinyin":"zhàng","meaning":"tăng lên (giá cả, lương)","example_hanzi":"价格上涨了很多。","example_viet":"Giá đã tăng rất nhiều."},{"hanzi":"掌握","pinyin":"zhǎng wò","meaning":"nắm vững","example_hanzi":"他掌握了这门技能。","example_viet":"Anh ấy đã nắm vững kỹ năng này."},{"hanzi":"账户","pinyin":"zhàng hù","meaning":"tài khoản","example_hanzi":"请在账户上写下你的名字。","example_viet":"Xin hãy viết tên của bạn trên tài khoản."},{"hanzi":"招待","pinyin":"zhāo dài","meaning":"chiêu đãi","example_hanzi":"我们将在晚会上招待客人。","example_viet":"Chúng tôi sẽ tiếp đãi khách mời tại bữa tiệc tối."},{"hanzi":"着火","pinyin":"zháo huǒ","meaning":"bắt lửa, bén lửa","example_hanzi":"火灾导致了房屋的严重损毁。","example_viet":"Hỏa hoạn đã gây ra sự hủy hoại nghiêm trọng cho ngôi nhà."},{"hanzi":"着凉","pinyin":"zháo liáng","meaning":"nhiễm lạnh","example_hanzi":"他感冒了，结果着凉了。","example_viet":"Anh ấy bị cảm và kết quả là bị lạnh."},{"ha :"mở to mắt, trợn mắt","example_hanzi":"请睁开眼睛看清楚。","example_viet":"Xin hãy mở mắt ra để nhìn rõ."},{"hanzi":"整个","pinyin":"zhěng gè","meaning":"cả, toàn bộ","example_hanzi":"整个城市都被雪覆盖了。","example_viet":"Toàn bộ thành phố bị bao phủ bởi tuyết."},{"hanzi":"整齐","pinyin":"zhěng qí","meaning":"gọn gàng, ngăn nắp","example_hanzi":"他的房间非常整齐。","example_viet":"Phòng của anh ấy rất gọn gàng."},{"hanzi":"整体","pinyin":"zhěng tǐ","meaning":"tổng thể","example_hanzi":"我们需要考虑整体方案。","example_viet":"Chúng ta cần xem xét kế hoạch tổng thể."},{"hanzi":"正","pinyin":"zhèng","meaning":"đứng (trái )","example_hanzi":"这篇文章正好符合要求。","example_viet":"Bài viết này chính xác phù hợp với yêu cầu."},{"hanzi":"证件","pinyin":"zhèng jiàn","meaning":"giấy tờ","example_hanzi":"请出示你的证件。","example_viet":"Xin hãy xuất trình giấy tờ của bạn."},{"hanzi":"证据","pinyin":"zhèng jù","meaning":"chứng cứ","example_hanzi":"我们需要提供证据来支持我们的观点。","example_viet":"Chúng ta cần cung cấp chứng cứ để hỗ trợ quan điểm của mình."},{"hanzi":"政府","pinyin":"zhèng fǔ","meaning":"chính phủ","example_hanzi":"政府正在制定新的政策。","example_viet":"Chính phủ đang xây dựng chính sách mới."},{"hanzi":"政治","pinyin":"zhèng zhì","meaning":"chính trị","example_hanzi":"政治问题很复杂。","example_viet":"Các vấn đề chính trị rất phức tạp."},{"hanzi":"挣","pinyin":"zhèng","meaning":"tranh, giành","example_hanzi":"他挣了很多钱。","example_viet":"Anh ấy đã kiếm được nhiều tiền."},{"hanzi":"支","pinyin":"zhī","meaning":"chiếc (lượng từ cho bút…)","example_hanzi":"这支笔很好用。","example_viet":"Cây bút này rất dễ sử dụng."},{"hanzi":"支票","pinyin":"zhī piào","meaning":"ngân phiếu","example_hanzi":"请把这笔支票填好。","example_viet":"Xin hãy điền vào tờ séc này."},{"hanzi":"执照","pinyin":"zhí zhào","meaning":"giấy phép","example_hanzi":"这个执照是有效的。","example_viet":"Giấy phép này là hợp lệ."},{"hanzi":"直","pinyin":"zhí","meaning":"thẳng","example_hanzi":"这条路很直。","example_viet":"Con đường này rất thẳng."},{"hanzi":"指导","pinyin":"zhǐ dǎo","meaning":"chỉ đạo","example_hanzi":"经理将指导你完成任务。","example_viet":"Quản lý sẽ hướng dẫn bạn hoàn thành nhiệm vụ."},{"hanzi":"指挥","pinyin":"zhǐ huī","meaning":"chỉ huy","example_hanzi":"指挥家正在指挥乐团演奏。","example_viet":"Nhạc trưởng đang chỉ huy dàn nhạc biểu diễn."},{"hanzi":"至今","pinyin":"zhì jīn","meaning":"đến nay","example_hanzi":"他至今还记得那个瞬间。","example_viet":"Anh ấy đến giờ vẫn nhớ khoảnh khắc đó."},{"hanzi":"至于","pinyin":"zhì yú","meaning":"còn như…..","example_hanzi":"这件事情至于你能否参加会议。","example_viet":"Vấn đề này phụ thuộc vào việc bạn có thể tham dự cuộc họp không."},{"hanzi":"志愿者","pinyin":"zhì yuàn zhě","meaning":"tình nguyện viên","example_hanzi":"她是一个热心的志愿者。","example_viet":"Cô ấy là một tình nguyện viên nhiệt tình."},{"hanzi":"制定","pinyin":"zhì dìng","meaning":"lập ra, thiết lập, xây dựng, lập (chính sách, qui định, kế hoạch, sách lược, phương án)","example_hanzi":"我们需要制定详细的计划。","example_viet":"Chúng ta cần lập kế hoạch chi tiết."},{"hanzi":"制度","pinyin":"zhì dù","meaning":"chế độ, chính sách","example_hanzi":"这个制度需要改进。","example_viet":"Hệ thống này cần được cải thiện."},{"hanzi":"制造","pinyin":"zhì zào","meaning":"sản xuất","example_hanzi":"这家公司专注于制造电子产品。","example_viet":"Công ty này chuyên về sản xuất các sản phẩm điện tử."},{"hanzi":"制作","pinyin":"zhì zuò","meaning":"làm, chế tạo","example_hanzi":"我们正在制作一个新的视频。","example_viet":"Chúng tôi đang sản xuất một video mới."},{"hanzi":"治疗","pinyin":"zhì liáo","meaning":"điều trị","example_hanzi":"这个药可以治疗你的病。","example_viet":"Thuốc này có thể chữa trị bệnh của bạn."},{"hanzi":"秩序","pinyin":"zhì xù","meaning":"trật tự","example_hanzi":"维持社会的秩序很重要。","example_viet":"Duy trì trật tự xã hội rất quan trọng."},{"hanzi":"智慧","pinyin":"zhì huì","meaning":"trí tuệ","example_hanzi":"他以智慧解决了这个难题。","example_viet":"Anh ấy đã giải quyết vấn đề khó khăn bằng trí tuệ."},{"hanzi":"中介","pinyin":"zhōng jiè","meaning":"môi giới, trung gian","example_hanzi":"他是一个有经验的中介。","example_viet":"Anh ấy là một trung gian có kinh nghiệm."},{"hanzi":"中心","pinyin":"zhōng xīn","meaning":"trung tâm","example_hanzi" nh ấy là trưởng dự án này."},{"hanzi":"主题","pinyin":"zhǔ tí","meaning":"chủ đề","example_hanzi":"主题是环保。","example_viet":"Chủ đề là bảo vệ môi trường."},{"hanzi":"主席","pinyin":"zhǔ xí","meaning":"chủ tịch","example_hanzi":"主席正在发言。","example_viet":"Chủ tịch đang phát biểu."},{"hanzi":"主张","pinyin":"zhǔ zhāng","meaning":"ý tưởng, ý kiến","example_hanzi":"我们主张保护环境。","example_viet":"Chúng tôi chủ trương bảo vệ môi trường."},{"hanzi":"煮","pinyin":"zhǔ","meaning":"luộc, đun","example_hanzi":"我们需要煮一些水。","example_viet":"Chúng ta cần đun sôi một ít nước."},{"hanzi":"注册","pinyin":"zhù cè","meaning":"đăng kí","example_hanzi":"请注册你的账户。","example_viet":"Xin hãy đăng ký tài khoản của bạn."},{"hanzi":"祝福","pinyin":"zhù fú","meaning":"chúc phúc","example_hanzi":"我祝福你们幸福快乐。","example_viet":"Tôi chúc các bạn hạnh phúc và vui vẻ."},{"hanzi":"抓","pinyin":"zhuā","meaning":"bắt, véo","example_hanzi":"他用力抓住了绳子。","example_viet":"Anh ấy nắm chặt sợi dây."},{"hanzi":"抓紧","pinyin":"zhuā jǐn","meaning":"(tay) nắm chắc, tranh thủ (thời gian)","example_hanzi":"请抓紧时间完成任务。","example_viet":"Xin hãy tranh thủ thời gian để hoàn thành nhiệm vụ."},{"hanzi":"专家","pinyin":"zhuān jiā","meaning":"chuyên gia","example_hanzi":"他是一位专家。","example_viet":"Anh ấy là một chuyên gia."},{"hanzi":"专心","pinyin":"zhuān xīn","meaning":"chuyên tâm","example_hanzi":"你要专心听讲。","example_viet":"Bạn cần tập trung nghe giảng."},{"hanzi":"转变","pinyin":"zhuǎn biàn","meaning":"chuyển biến","example_hanzi":"这次转变对公司很重要。","example_viet":"Sự thay đổi lần này rất quan trọng đối với công ty."},{"hanzi":"转告","pinyin":"zhuǎn gào","meaning":"chuyển lời","example_hanzi":"我会把这个消息转告给你。","example_viet":"Tôi sẽ chuyển thông tin này cho bạn."},{"hanzi":"装","pinyin":"zhuāng","meaning":"đựng, chứa","example_hanzi":"她正在装行李。","example_viet":"Cô ấy đang đóng gói hành lý."},{"hanzi":"装饰","pinyin":"zhuāng shì","meaning":"trang hoàng, trang trí","example_hanzi":"她在房间里做了很多装饰。","example_viet":"Cô ấy đã làm rất nhiều trang trí trong phòng."},{"hanzi":"装修"," zi":"检讨","pinyin":"jiǎn tǎo","meaning":"kiểm điểm, xem xét lại","example_hanzi":"我们会在会议上检讨这个计划。","example_viet":"Chúng ta sẽ kiểm tra lại kế hoạch này trong cuộc họp."},{"hanzi":"简体字","pinyin":"jiǎn tǐ zì","meaning":"chữ giản thể","example_hanzi":"简体字比繁体字更容易学习。","example_viet":"Chữ giản thể dễ học hơn chữ phồn thể."},{"hanzi":"检验","pinyin":"jiǎn yàn","meaning":"kiểm nghiệm, kiểm tra","example_hanzi":"科学家正在检验新药的效果。","example_viet":"Các nhà khoa học đang kiểm nghiệm hiệu quả của thuốc mới."},{"hanzi":"简要","pinyin":"jiǎn yào","meaning":"tóm tắt, ngắn gọn","example_hanzi":"他简要地介绍了会议的主要内容。","example_viet":"Anh ấy tóm tắt nội dung chính của cuộc họp."},{"hanzi":"溅","pinyin":"jiàn","meaning":"bắn lên, văng ra","example_hanzi":"水溅到了我的衣服上。","example_viet":"Nước bắn lên quần áo của tôi."},{"hanzi":"鉴别","pinyin":"jiàn bié","meaning":"phân biệt, nhận định","example_hanzi":"专家们正在鉴别这幅画的真伪。","example_viet":"Các chuyên gia đang xác định tính xác thực của bức tranh này."},{"hanzi":"间谍","pinyin":"jiàn dié","meaning":"gián điệp","example_hanzi":"他是一个间谍，潜伏在敌人内部。","example_viet":"Anh ta là một điệp viên, nằm vùng trong hàng ngũ địch."},{"hanzi":"鉴定","pinyin":"jiàn dìng","meaning":"giám định, xác định","example_hanzi":"这栋建筑需要进行安全鉴定。","example_viet":"Tòa nhà này cần được đánh giá an toàn."},{"hanzi":"见多识广","pinyin":"jiàn duō shí guǎng","meaning":"hiểu biết rộng rãi","example_hanzi":"他是个见多识广的人，什么都知道。","example_viet":"Anh ấy là một người hiểu biết rộng, cái gì cũng biết."},{"hanzi":"间隔","pinyin":"jiàn gé","meaning":"khoảng cách, khoảng thời gian","example_hanzi":"两次会议之间有一个小时的间隔。","example_viet":"Có một khoảng cách một giờ giữa hai cuộc họp."},{"hanzi":"间接","pinyin":"jiàn jiē","meaning":"gián tiếp","example_hanzi":"我们通过间接证据推断出真相。","example_viet":"Chúng tôi suy luận ra sự thật thông qua các chứng cứ gián tiếp."},{"hanzi":"见解","pinyin":"jiàn jiě","meaning":"cách nhìn, quan điểm","example_hanzi":"他的见解很独特，值得参考。","example_viet":"Quan điểm của anh ấy rất độc đáo, đáng để tham khảo."},{"hanzi":"健全" zi":"尽快","pinyin":"jǐn kuài","meaning":"nhanh chóng, càng sớm càng tốt","example_hanzi":"我们需要尽快完成这个项目。","example_viet":"Chúng ta cần nhanh chóng hoàn thành dự án này."},{"hanzi":"尽量","pinyin":"jǐn liàng","meaning":"hết sức, cố gắng hết mức","example_hanzi":"请尽量简化流程，提高效率。","example_viet":"Vui lòng đơn giản hóa quy trình, nâng cao hiệu suất."},{"hanzi":"紧密","pinyin":"jǐn mì","meaning":"chặt chẽ, mật thiết","example_hanzi":"我们要保持紧密的合作关系。","example_viet":"Chúng ta cần giữ mối quan hệ hợp tác chặt chẽ."},{"hanzi":"紧迫","pinyin":"jǐn pò","meaning":"cấp bách, khẩn cấp","example_hanzi":"这个任务非常紧迫，必须立即完成。","example_viet":"Nhiệm vụ này rất cấp bách, cần phải hoàn thành ngay lập tức."},{"hanzi":"锦绣前程","pinyin":"jǐn xiù qián chéng","meaning":"tiền đồ sáng lạn","example_hanzi":"你有一段锦绣前程。","example_viet":"Bạn có một tương lai tươi sáng."},{"hanzi":"进而","pinyin":"jìn ér","meaning":"tiếp đó, sau đó","example_hanzi":"他进而提出了新的建议。","example_viet":"Anh ấy tiến thêm một bước và đưa ra đề xuất mới."},{"hanzi":"进攻","pinyin":"jìn gōng","meaning":"tấn công","example_hanzi":"敌军发动了猛烈的进攻。","example_viet":"Quân địch phát động một cuộc tấn công mãnh liệt."},{"hanzi":"进化","pinyin":"jìn huà","meaning":"tiến hóa","example_hanzi":"人类在不断进化中。","example_viet":"Loài người đang không ngừng tiến hóa."},{"hanzi":"近来","pinyin":"jìn lái","meaning":"gần đây","example_hanzi":"近来，天气变得越来越热。","example_viet":"Gần đây, thời tiết ngày càng nóng hơn."},{"hanzi":"浸泡","pinyin":"jìn pào","meaning":"ngâm, tẩm","example_hanzi":"他把茶叶浸泡在热水中。","example_viet":"Anh ấy ngâm lá trà trong nước nóng."},{"hanzi":"晋升","pinyin":"jìn shēng","meaning":"thăng tiến, thăng chức","example_hanzi":"他被晋升为经理。","example_viet":"Anh ấy được thăng chức làm quản lý."},{"hanzi":"近视","pinyin":"jìn shì","meaning":"cận thị","example_hanzi":"她患有近视，需要戴眼镜。","example_viet":"Cô ấy bị cận thị, cần đeo kính."},{"hanzi":"劲头","pinyin":"jìn tóu","meaning":"hứng thú, động lực","example_hanzi":"他做事非常有劲头。","example_viet":"Anh ấy làm việc rất có động lực."},{"hanzi":" {"hanzi":"揍","pinyin":"zòu","meaning":"Đánh","example_hanzi":"他被人揍了一顿。","example_viet":"Anh ấy bị người ta đánh một trận."},{"hanzi":"租赁","pinyin":"zūlìn","meaning":"Thuê","example_hanzi":"我们需要租赁一些设备。","example_viet":"Chúng ta cần thuê một số thiết bị."},{"hanzi":"足以","pinyin":"zúyǐ","meaning":"Đủ để","example_hanzi":"这个方法足以解决问题。","example_viet":"Cách này đủ để giải quyết vấn đề."},{"hanzi":"组","pinyin":"zǔ","meaning":"Nhóm","example_hanzi":"我加入了一个学习组。","example_viet":"Tôi đã tham gia một nhóm học tập."},{"hanzi":"阻碍","pinyin":"zǔ'ài","meaning":"Cản trở","example_hanzi":"雪阻碍了交通。","example_viet":"Tuyết cản trở giao thông."},{"hanzi":"祖父","pinyin":"zǔfù","meaning":"Ông nội","example_hanzi":"我的祖父很喜欢下棋。","example_viet":"Ông tôi rất thích chơi cờ."},{"hanzi":"阻拦","pinyin":"zǔlán","meaning":"Ngăn cản","example_hanzi":"我们需要找到阻拦他的方法。","example_viet":"Chúng ta cần tìm cách ngăn chặn anh ấy."},{"hanzi":"阻挠","pinyin":"zǔnáo","meaning":"Cản trở","example_hanzi":"他试图阻挠我们的计划。","example_viet":"Anh ấy cố gắng cản trở kế hoạch của chúng tôi."},{"hanzi":"钻研","pinyin":"zuānyán","meaning":"Nghiên cứu kỹ lưỡng","example_hanzi":"他钻研了这个课题很多年。","example_viet":"Anh ấy đã nghiên cứu chủ đề này nhiều năm."},{"hanzi":"钻石","pinyin":"zuànshí","meaning":"Kim cương","example_hanzi":"她收到了一颗钻石戒指。","example_viet":"Cô ấy đã nhận được một chiếc nhẫn kim cương."},{"hanzi":"嘴唇","pinyin":"zuǐchún","meaning":"Môi","example_hanzi":"她的嘴唇很红润。","example_viet":"Môi của cô ấy rất hồng hào."},{"hanzi":"遵循","pinyin":"zūnxún","meaning":"Tuân theo","example_hanzi":"我们要遵循公司的规定。","example_viet":"Chúng ta phải tuân theo quy định của công ty."},{"hanzi":"尊严","pinyin":"zūnyán","meaning":"Nhân phẩm","example_hanzi":"他一直保持着自己的尊严。","example_viet":"Anh ấy luôn giữ gìn lòng tự trọng của mình."},{"hanzi":"左右","pinyin":"zuǒyòu","meaning":"Khoảng","example_hanzi":"他试图左右我们的决定。","example_viet":"Anh ấy cố gắng ảnh hưởng đến quyết định của chúng tôi."},{"hanzi":"作弊","pinyin":"zuòbì","meaning":"Gian lận","example_hanzi":"作弊是不道德的行为。","example_viet":"Gian lận là hành vi không đạo đức."},{"hanzi":"做东","pinyin":"zuòdōng","meaning":"Làm chủ","example_hanzi":"今天他是做东的。","example_viet":"Hôm nay anh ấy là chủ nhà."},{"hanzi":"作废","pinyin":"zuòfèi","meaning":"Vô hiệu","example_hanzi":"这些旧文件需要作废。","example_viet":"Những tài liệu cũ này cần bị hủy bỏ."},{"hanzi":"作风","pinyin":"zuòfēng","meaning":"Phong cách","example_hanzi":"公司需要改进作风。","example_viet":"Công ty cần cải thiện tác phong."},{"hanzi":"作息","pinyin":"zuòxī","meaning":"Làm việc và nghỉ ngơi","example_hanzi":"我们的作息时间要规律。","example_viet":"Giờ giấc sinh hoạt của chúng ta cần phải có quy củ."},{"hanzi":"座右铭","pinyin":"zuòyòumíng","meaning":"Câu nói yêu thích","example_hanzi":"他的座右铭是\"努力奋斗\"。","example_viet":"Châm ngôn của anh ấy là \"cố gắng phấn đấu\"."},{"hanzi":"做主","pinyin":"zuòzhǔ","meaning":"Quyết định","example_hanzi":"他愿意为自己做主。","example_viet":"Anh ấy sẵn sàng tự làm chủ."}]
};

let level='HSK1',mode='flashcard';
let words=[],idx=0,revealed=false;
let total=0,correct=0,wrong=0;
let mcChoices=[],mcAnswered=false;
let typeAnswered=false;

function shuffle(a){return a.sort(()=>Math.random()-.5)}

function setLevel(l){
  level=l;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.getAttribute('onclick').includes("'"+l+"'")));
  total=correct=wrong=0;words=shuffle([...VOCAB[l]]);idx=0;
  updateStats();render();
}

function setMode(m){
  mode=m;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active',b.getAttribute('onclick').includes("'"+m+"'")));
  total=correct=wrong=0;words=shuffle([...VOCAB[level]]);idx=0;
  updateStats();render();
}

function updateStats(){
  document.getElementById('s-total').textContent=total;
  document.getElementById('s-correct').textContent=correct;
  document.getElementById('s-wrong').textContent=wrong;
  document.getElementById('s-pct').textContent=total>0?Math.round(correct/total*100)+'%':'—';
  document.getElementById('prog').style.width=(words.length?Math.round(idx/words.length*100):0)+'%';
}

function next(){idx=(idx+1)%words.length;revealed=false;mcAnswered=false;typeAnswered=false;render();}
function prev(){idx=(idx-1+words.length)%words.length;revealed=false;mcAnswered=false;typeAnswered=false;render();}

function render(){
  updateStats();
  const w=words[idx];
  const qa=document.getElementById('quiz-area');
  const nav=document.getElementById('nav-area');
  if(mode==='flashcard')renderFlashcard(w,qa,nav);
  else if(mode==='mc')renderMC(w,qa,nav);
  else if(mode==='type')renderType(w,qa,nav);
  else renderListen(w,qa,nav);
}

function badge(){return `<span class="badge badge-${level.toLowerCase()}">${level}</span>`;}

function exBox(w){
  if(!w.example_hanzi)return '';
  return `<div class="example-box"><div class="ex-zh">${w.example_hanzi}</div>${w.example_viet?`<div class="ex-vn">🇻🇳 ${w.example_viet}</div>`:''}</div>`;
}

function renderFlashcard(w,qa,nav){
  qa.innerHTML=`<div class="card">${badge()}<div class="hanzi" onclick="revealed=true;render()">${w.hanzi}</div><div class="pinyin">${revealed?w.pinyin:''}</div><div class="meaning">${revealed?w.meaning:''}</div>${revealed?exBox(w):''}<div class="hint">${revealed?'':'Nhấn vào chữ để xem nghĩa'}</div></div>`;
  nav.innerHTML=`<button class="btn" onclick="prev()">← Trước</button><span style="font-size:13px;color:#888;padding:0 .5rem">${idx+1}/${words.length}</span><button class="btn" onclick="next()">Tiếp →</button>`;
}

function renderMC(w,qa,nav){
  if(!mcAnswered){
    const pool=VOCAB[level].filter(x=>x.meaning!==w.meaning);
    shuffle(pool);
    mcChoices=shuffle([w.meaning,...pool.slice(0,3).map(x=>x.meaning)]);
  }
  const choiceHtml=mcChoices.map(c=>`<button class="choice" onclick="answerMC(this)" data-val="${c.replace(/"/g,'&quot;')}" ${mcAnswered?'disabled':''}>${c}</button>`).join('');
  qa.innerHTML=`<div class="card">${badge()}<div class="hanzi">${w.hanzi}</div><div class="pinyin">${w.pinyin}</div><div class="hint">Chọn nghĩa đúng</div></div><div class="choices">${choiceHtml}</div><div id="mc-ex"></div>`;
  nav.innerHTML=mcAnswered?'<button class="btn primary" onclick="next()">Tiếp theo →</button>':'';
}

function answerMC(el){
  if(mcAnswered)return;
  mcAnswered=true;
  const w=words[idx];
  const chosen=el.getAttribute('data-val');
  total++;
  if(chosen===w.meaning)correct++;else wrong++;
  document.querySelectorAll('.choice').forEach(b=>{
    b.disabled=true;
    const v=b.getAttribute('data-val');
    if(v===w.meaning)b.classList.add('correct');
    else if(v===chosen)b.classList.add('wrong');
  });
  updateStats();
  document.getElementById('nav-area').innerHTML='<button class="btn primary" onclick="next()">Tiếp theo →</button>';
  document.getElementById('mc-ex').innerHTML=exBox(w);
}

function renderType(w,qa,nav){
  qa.innerHTML=`<div class="card">${badge()}<div class="hanzi">${w.hanzi}</div><div class="pinyin">${w.pinyin}</div><div class="hint">Gõ nghĩa tiếng Việt</div></div><div class="input-row"><input class="ans-input" id="type-input" placeholder="Nhập nghĩa..." ${typeAnswered?'disabled':''} onkeydown="if(event.key==='Enter')checkType()">${!typeAnswered?'<button class="btn primary" onclick="checkType()">Kiểm tra</button>':''}</div><div id="type-fb"></div><div id="type-ex"></div>`;
  nav.innerHTML=typeAnswered?'<button class="btn primary" onclick="next()">Tiếp theo →</button>':'';
  if(!typeAnswered)setTimeout(()=>{const el=document.getElementById('type-input');if(el)el.focus();},50);
}

function checkType(){
  if(typeAnswered)return;
  const inp=document.getElementById('type-input');
  if(!inp)return;
  const val=inp.value.trim().toLowerCase();
  const w=words[idx];
  const meanings=w.meaning.toLowerCase().split(/[,，\/]/);
  const isOk=meanings.some(m=>val&&(m.trim().includes(val)||val.includes(m.trim())));
  typeAnswered=true;total++;
  if(isOk)correct++;else wrong++;
  updateStats();
  inp.disabled=true;
  document.getElementById('type-fb').innerHTML=`<div class="feedback ${isOk?'ok':'bad'}">${isOk?'✓ Đúng rồi!':'✗ Sai. Nghĩa đúng: <strong>'+w.meaning+'</strong>'}</div>`;
  document.getElementById('nav-area').innerHTML='<button class="btn primary" onclick="next()">Tiếp theo →</button>';
  document.getElementById('type-ex').innerHTML=exBox(w);
}

function renderListen(w,qa,nav){
  qa.innerHTML=`<div class="card">${badge()}<div style="font-size:13px;color:#888;margin-bottom:.5rem">Nghĩa tiếng Việt:</div><div style="font-size:20px;font-weight:600">${w.meaning}</div>${w.example_viet?`<div style="font-size:13px;color:#888;margin-top:.5rem">🇻🇳 ${w.example_viet}</div>`:''}<div class="hint" style="margin-top:.75rem">Đoán chữ Hán</div></div>${!revealed?'<button class="btn" style="width:100%;margin-bottom:.5rem" onclick="revealed=true;render()">Xem đáp án</button>':`<div class="card" style="min-height:auto;padding:1rem"><div class="hanzi" style="font-size:42px">${w.hanzi}</div><div class="pinyin">${w.pinyin}</div>${exBox(w)}</div><div style="display:flex;gap:.5rem;margin-bottom:.5rem"><button class="btn ok" style="flex:1" onclick="listenAnswer(true)">✓ Đúng</button><button class="btn bad" style="flex:1" onclick="listenAnswer(false)">✗ Sai</button></div>`}`;
  nav.innerHTML=`<span style="font-size:13px;color:#888">${idx+1}/${words.length}</span>`;
}

function listenAnswer(ok){total++;if(ok)correct++;else wrong++;updateStats();next();}

words=shuffle([...VOCAB['HSK1']]);
render();
</script>
</body>
</html>
